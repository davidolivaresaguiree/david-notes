<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notedev</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="more">
            <button><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-panel-left-icon lucide-panel-left">
                    <rect width="18" height="18" x="3" y="3" rx="2" />
                    <path d="M9 3v18" />
                </svg></button>
        </div>
        <div class="nav-bar">
            <a href="landing.html" title="Inicio"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="lucide lucide-house-icon lucide-house">
                    <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                    <path
                        d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                </svg></a>
            <a href="#" title="Crear"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-plus-icon lucide-plus">
                    <path d="M5 12h14" />
                    <path d="M12 5v14" />
                </svg></a>
            <a href="#" title="Notas"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-folder-icon lucide-folder">
                    <path
                        d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
                </svg></a>
        </div>
        <div class="profile" id="config">
            <button class="open-config"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="lucide lucide-cog-icon lucide-cog">
                    <path d="M11 10.27 7 3.34" />
                    <path d="m11 13.73-4 6.93" />
                    <path d="M12 22v-2" />
                    <path d="M12 2v2" />
                    <path d="M14 12h8" />
                    <path d="m17 20.66-1-1.73" />
                    <path d="m17 3.34-1 1.73" />
                    <path d="M2 12h2" />
                    <path d="m20.66 17-1.73-1" />
                    <path d="m20.66 7-1.73 1" />
                    <path d="m3.34 17 1.73-1" />
                    <path d="m3.34 7 1.73 1" />
                    <circle cx="12" cy="12" r="2" />
                    <circle cx="12" cy="12" r="8" />
                </svg></button>
        </div>
    </header>

    <div class="nota-rapida">
        <div class="nota">
            <div class="contenido-nota">
                <h1>Nota rápida</h1>
                <p>Toca para escribir tu nota aquí...</p>
            </div>
        </div>

        <div class="nota-crear">
            <div class="container">
                <div class="btn-toolbar">
                    <button onclick="formatDoc('undo')"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-undo2-icon lucide-undo-2">
                            <path d="M9 14 4 9l5-5" />
                            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" />
                        </svg></button>
                    <button onclick="formatDoc('redo')"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-redo2-icon lucide-redo-2">
                            <path d="m15 14 5-5-5-5" />
                            <path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13" />
                        </svg></button>
                    <button onclick="formatDoc('bold')"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-bold-icon lucide-bold">
                            <path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8" />
                        </svg></button>
                    <button onclick="formatDoc('underline')"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                            height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-underline-icon lucide-underline">
                            <path d="M6 4v6a6 6 0 0 0 12 0V4" />
                            <line x1="4" x2="20" y1="20" y2="20" />
                        </svg></button>
                    <button onclick="formatDoc('italic')"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-italic-icon lucide-italic">
                            <line x1="19" x2="10" y1="4" y2="4" />
                            <line x1="14" x2="5" y1="20" y2="20" />
                            <line x1="15" x2="9" y1="4" y2="20" />
                        </svg></button>
                    <button onclick="formatDoc('strikethrough')"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                            height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-strikethrough-icon lucide-strikethrough">
                            <path d="M16 4H9a3 3 0 0 0-2.83 4" />
                            <path d="M14 12a4 4 0 0 1 0 8H6" />
                            <line x1="4" x2="20" y1="12" y2="12" />
                        </svg></button>
                    <button onclick="formatDoc('justifyLeft')"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                            height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-text-align-start-icon lucide-text-align-start">
                            <path d="M21 5H3" />
                            <path d="M15 12H3" />
                            <path d="M17 19H3" />
                        </svg></button>
                    <button onclick="formatDoc('justifyCenter')"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                            height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-text-align-center-icon lucide-text-align-center">
                            <path d="M21 5H3" />
                            <path d="M17 12H7" />
                            <path d="M19 19H5" />
                        </svg></button>
                    <button onclick="formatDoc('justifyRight')"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                            height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-text-align-end-icon lucide-text-align-end">
                            <path d="M21 5H3" />
                            <path d="M21 12H9" />
                            <path d="M21 19H7" />
                        </svg></button>
                    <button onclick="formatDoc('justifyFull')"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                            height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-text-align-justify-icon lucide-text-align-justify">
                            <path d="M3 5h18" />
                            <path d="M3 12h18" />
                            <path d="M3 19h18" />
                        </svg></button>
                    <button onclick="formatDoc('insertOrderedList')"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                            height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-icon lucide-list">
                            <path d="M3 5h.01" />
                            <path d="M3 12h.01" />
                            <path d="M3 19h.01" />
                            <path d="M8 5h13" />
                            <path d="M8 12h13" />
                            <path d="M8 19h13" />
                        </svg></button>
                </div>
                <div class="contenido" contenteditable="true" spellcheck="false" data-placeholder="Escribe tu nota"
                    aria-placeholder="Escribe tu nota" role="textbox">
                </div>
            </div>
            <div class="opciones-guardar">
                <button class="close-nota"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-x-icon lucide-x">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg></button>
                <button><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-check-icon lucide-check">
                        <path d="M20 6 9 17l-5-5" />
                    </svg></button>
            </div>
        </div>

    </div>



    <div class="marco-config">

        <div class="modal-config">
            <div class="opciones-config">
                <button id="cerrar" class="cerrar-config"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-x-icon lucide-x">
                        <path d="M18 6 6 18" />
                        <path d="m6 6 12 12" />
                    </svg></button>
                <button id="profile"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-circle-user-round-icon lucide-circle-user-round">
                        <path d="M17.925 20.056a6 6 0 0 0-11.851.001" />
                        <circle cx="12" cy="11" r="4" />
                        <circle cx="12" cy="12" r="10" />
                    </svg></button>
            </div>
            <div class="contenido-congif">
                <div class="opciones-contenido">
                    <button class="close-info"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-palette-icon lucide-palette">
                            <path
                                d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z" />
                            <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" />
                            <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" />
                            <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" />
                            <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" />
                        </svg>
                        <p>Apariencia</p>
                    </button>
                    <button class="open-info"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info-icon lucide-info">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M12 16v-4" />
                            <path d="M12 8h.01" />
                        </svg>
                        <p>Información</p>
                    </button>
                </div>
                <div class="config-opciones-modal">
                    <div class="apariencias">
                        <button id="cambiar-apariencia-azul" class="color-azul"></button>
                    </div>
                    <div class="informacion">
                        <h2>Información</h2>
                        <p>Información sobre el desarrollador</p>
                        <button><a href="https://portafolio-kappa-three-85.vercel.app/#home">David Olivares
                                [PORTAFOLIO]</a></button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
